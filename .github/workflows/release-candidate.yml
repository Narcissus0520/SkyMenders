name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Candidate version in 1.0.0-rc.1 form
        required: true
        type: string
  push:
    tags: ["v*-rc.*"]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm workspace:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:determinism
      - run: pnpm test:performance
      - run: pnpm test:e2e
      - run: pnpm content:validate
      - run: pnpm security:secrets
      - run: pnpm security:audit
      - run: pnpm build
      - run: pnpm cocos:check
      - run: pnpm release:gate
        env:
          RELEASE_CANDIDATE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version || github.ref_name }}
          RELEASE_CANDIDATE_COMMIT: ${{ github.sha }}
