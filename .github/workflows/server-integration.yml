name: Server Integration

on:
  pull_request:
    paths:
      - "apps/game-server/**"
      - "apps/game-worker/**"
      - "content/**"
      - "packages/ai-core/**"
      - "packages/battle-core/**"
      - "packages/challenge-core/**"
      - "packages/content-runtime/**"
      - "packages/content-pipeline/**"
      - "packages/content-schema/**"
      - "packages/deterministic-runtime/**"
      - "packages/protocol/**"
      - "packages/save-migration/**"
      - "packages/security/**"
      - "packages/shared-types/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/server-integration.yml"
  push:
    branches: [main]
    paths:
      - "apps/game-server/**"
      - "apps/game-worker/**"
      - "content/**"
      - "packages/ai-core/**"
      - "packages/battle-core/**"
      - "packages/challenge-core/**"
      - "packages/content-runtime/**"
      - "packages/content-pipeline/**"
      - "packages/content-schema/**"
      - "packages/deterministic-runtime/**"
      - "packages/protocol/**"
      - "packages/save-migration/**"
      - "packages/security/**"
      - "packages/shared-types/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/server-integration.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: skymenders_test
          POSTGRES_USER: skymenders
          POSTGRES_PASSWORD: skymenders_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skymenders -d skymenders_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://skymenders:skymenders_test_only@127.0.0.1:5432/skymenders_test
      TEST_DATABASE_URL: postgresql://skymenders:skymenders_test_only@127.0.0.1:5432/skymenders_test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm test:integration
